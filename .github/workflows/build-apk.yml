name: Fabriquer l'APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Générer la partie Android
        run: |
          flutter create --platforms=android --org ci.desimone --project-name repas_seguela .
          rm -f test/widget_test.dart
          python3 tool/prepare_android.py

      - name: Configuration Firebase
        run: python3 tool/gen_options.py firebase/google-services.json lib/firebase_options.dart

      - name: Clé de signature fixe (mises à jour sans désinstaller)
        run: |
          mkdir -p ~/.android
          cp tool/signing/debug.keystore ~/.android/debug.keystore

      - name: Dépendances
        run: flutter pub get

      - name: Compiler l'APK
        run: flutter build apk --release

      - name: Nommer le fichier
        id: name
        run: |
          V="1.0.${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk "RepasSeguela-v$V.apk"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: RepasSeguela-v${{ steps.name.outputs.version }}
          path: RepasSeguela-v${{ steps.name.outputs.version }}.apk

      - name: Publier la version (page Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.name.outputs.version }}
          name: Repas Séguéla v${{ steps.name.outputs.version }}
          body: |
            Fichier d'installation Android de l'application de commande des repas — DESIMONE CI, site de Séguéla.
            Téléchargez le fichier .apk ci-dessous sur le téléphone, puis ouvrez-le pour l'installer.
          files: RepasSeguela-v${{ steps.name.outputs.version }}.apk
